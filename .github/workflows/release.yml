name: Release

# Builds the Windows package and publishes it as a GitHub release.
# Either push a tag like v0.1.0, or run the workflow manually: without a tag
# input it releases v<version from Cargo.toml> (creating the tag if needed).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (default: v<version> from Cargo.toml)"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        id: tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          elseif ($env:INPUT_TAG) { $tag = $env:INPUT_TAG }
          else {
            $m = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1
            $tag = 'v' + $m.Matches[0].Groups[1].Value
          }
          "name=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release -p game-box --features steam
      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Game Box ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: dist/game-box-windows-x64.zip
