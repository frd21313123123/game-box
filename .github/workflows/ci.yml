name: CI

# Every build, from every branch, builds the Windows exe and publishes it as a
# pre-release "build-<run number>" on the Releases page. A push to a branch
# with an open pull request already builds that code, so pull requests are not
# built a second time.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Runs are never cancelled, so every build reaches the Releases page.
concurrency:
  group: ci-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The main branch's push builds are the only ones allowed to save the cache
  # (see `save-if`); every other run restores it.
  IS_MAIN: ${{ github.event_name == 'push' && contains(fromJSON('["refs/heads/main","refs/heads/master","refs/heads/claude/rust-game-launcher-px1e6e"]'), github.ref) }}

jobs:
  # Rule engines and networking: fast, no graphics dependencies.
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.IS_MAIN == 'true' }}
      - run: cargo test -p uno-core -p blackjack-core -p monopoly-core -p netcode

  # One job builds the exe and runs the launcher's tests in the same release
  # profile, so Bevy is compiled once. (A separate debug test job compiled it a
  # second time and took ~28 minutes, longer than the exe itself.)
  build-windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    env:
      # LLVM's linker ships with rustup and links Bevy far faster than link.exe.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with the Release workflow: same toolchain, profile and features.
          shared-key: windows-release
          save-if: ${{ env.IS_MAIN == 'true' }}
      - name: Build release
        run: cargo build --release -p game-box --features steam
      - name: Test launcher
        run: cargo test --release -p game-box --features steam
      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: game-box-windows-x64
          path: dist/game-box-windows-x64.zip
          if-no-files-found: error

  # Publishes the exe as a pre-release. Pre-releases are skipped by
  # `releases/latest`, which the launcher's updater reads, so builds never
  # replace the version the updater offers. Runs for every branch.
  publish-build:
    name: Publish build release
    needs: [core, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: game-box-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Сборка #${{ github.run_number }} (${{ github.ref_name }})"
          prerelease: true
          generate_release_notes: true
          files: game-box-windows-x64.zip
