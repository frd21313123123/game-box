name: CI

# Every push to the main branch builds the Windows exe and publishes it as a
# pre-release "build-<run number>" on the Releases page. Pull requests only
# build and test; they publish nothing.
on:
  pull_request:
  push:
    # claude/rust-game-launcher-px1e6e is this repository's main branch.
    branches: [main, master, claude/rust-game-launcher-px1e6e]
  workflow_dispatch:

# Only a newer push to a pull request cancels an older run. Builds on main are
# never cancelled, so every build reaches the Releases page.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Release builds and the main branch's push builds, which are the only ones
  # allowed to save the cache (see `save-if`); every other run restores it.
  IS_MAIN: ${{ github.event_name == 'push' && contains(fromJSON('["refs/heads/main","refs/heads/master","refs/heads/claude/rust-game-launcher-px1e6e"]'), github.ref) }}

jobs:
  # Rule engines and networking: fast, no graphics dependencies.
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.IS_MAIN == 'true' }}
      - run: cargo test -p uno-core -p blackjack-core -p monopoly-core -p netcode

  # One job builds the exe and runs the launcher's tests in the same release
  # profile, so Bevy is compiled once. (A separate debug test job compiled it a
  # second time and took ~28 minutes, longer than the exe itself.)
  build-windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    env:
      # LLVM's linker ships with rustup and links Bevy far faster than link.exe.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with the Release workflow: same toolchain, profile and features.
          shared-key: windows-release
          save-if: ${{ env.IS_MAIN == 'true' }}
      - name: Build release
        run: cargo build --release -p game-box --features steam
      - name: Test launcher
        run: cargo test --release -p game-box --features steam
      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: game-box-windows-x64
          path: dist/game-box-windows-x64.zip
          if-no-files-found: error

  # Publishes the exe as a pre-release. Pre-releases are skipped by
  # `releases/latest`, which the launcher's updater reads, so builds from main
  # never replace the version the updater offers.
  publish-build:
    name: Publish build release
    needs: [core, build-windows]
    # Pushes to the main branch, or a manual run started on it.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      contains(fromJSON('["refs/heads/main","refs/heads/master","refs/heads/claude/rust-game-launcher-px1e6e"]'), github.ref)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: game-box-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Сборка #${{ github.run_number }}"
          prerelease: true
          generate_release_notes: true
          files: game-box-windows-x64.zip
