name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Rule engines and networking: fast, no graphics dependencies.
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p uno-core -p monopoly-core -p netcode

  # The real thing: build the launcher for Windows and keep the exe as an artifact.
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --features steam
      - name: Build release
        run: cargo build --release -p game-box --features steam
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/game-box | Out-Null
          Copy-Item target/release/game-box.exe dist/game-box/
          $dll = Get-ChildItem -Path target/release/build -Recurse -Filter steam_api64.dll | Select-Object -First 1
          Copy-Item $dll.FullName dist/game-box/
      - uses: actions/upload-artifact@v4
        with:
          name: game-box-windows
          path: dist/game-box
          if-no-files-found: error
