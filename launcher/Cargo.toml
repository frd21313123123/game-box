[package]
name = "game-box"
description = "Игровой лаунчер: Монополия и Уно"
edition.workspace = true
version.workspace = true
license.workspace = true
default-run = "game-box"

[features]
default = []
# Steam integration: nicknames from Steam, lobbies and invites through the
# Steam overlay, P2P networking via Steam Networking Messages.
# Requires the Steam client running; uses Spacewar (AppID 480) unless a
# steam_appid.txt with your own AppID is placed next to the executable.
steam = ["dep:steamworks"]

[dependencies]
uno-core = { path = "../crates/uno-core" }
monopoly-core = { path = "../crates/monopoly-core" }
netcode = { path = "../crates/netcode" }
serde.workspace = true
serde_json.workspace = true
bevy = { version = "0.16", features = ["wav"] }
bevy_egui = "0.35"
tiny-skia = "0.11"
ab_glyph = "0.2"
dirs = "6"
steamworks = { version = "0.12", optional = true }
