[package]
name = "game-box"
description = "Игровой лаунчер: Монополия, Уно и Блэкджек"
edition.workspace = true
version.workspace = true
license.workspace = true
default-run = "game-box"

[features]
default = []
# Steam integration: nicknames from Steam, lobbies and invites through the
# Steam overlay, P2P networking via Steam Networking Messages.
# Requires the Steam client running; uses Spacewar (AppID 480) unless a
# steam_appid.txt with your own AppID is placed next to the executable.
steam = ["dep:steamworks"]

[dependencies]
uno-core = { path = "../crates/uno-core" }
blackjack-core = { path = "../crates/blackjack-core" }
monopoly-core = { path = "../crates/monopoly-core" }
netcode = { path = "../crates/netcode" }
serde.workspace = true
serde_json.workspace = true
# Only the parts of Bevy the launcher uses (3D scene, audio, egui UI). The
# default set also pulls in glTF, animation, scenes, gamepads, bevy_ui/text,
# sprites, picking and more, which roughly doubles the build time.
bevy = { version = "0.16", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_audio",
    "wav",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_state",
    "bevy_window",
    "bevy_winit",
    "bevy_log",
    # Camera3d's default tonemapper (TonyMcMapface) needs these lookup tables.
    "tonemapping_luts",
    # Debug screenshots (debug.rs) are saved as PNG.
    "png",
    "x11",
] }
bevy_egui = "0.35"
tiny-skia = "0.11"
ab_glyph = "0.2"
dirs = "6"
ureq = { version = "2", features = ["json"] }
# raw-bindings: the P2P session-request callback is registered by hand (see steam.rs).
steamworks = { version = "0.12", features = ["raw-bindings"], optional = true }
